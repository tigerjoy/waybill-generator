  <script>
    (function () {
      var STORAGE_KEY = 'joymaa_saved_buses';
      var defaultBuses = ['WB 07 J 4625', 'WB 07 K 1190', 'WB 19 H 8834', 'WB 04 G 3021'];
      var savedBuses;
      try {
        savedBuses = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || defaultBuses.slice();
      } catch (e) {
        savedBuses = defaultBuses.slice();
      }

      var wrapper = document.getElementById('bus-combobox-wrapper');
      var input = document.getElementById('bus-number-input');
      var toggle = document.getElementById('bus-dropdown-toggle');
      var listbox = document.getElementById('bus-number-listbox');
      if (!wrapper || !input || !toggle || !listbox) return;

      function persistBuses() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(savedBuses)); } catch (e) {}
      }

      function setOpen(open) {
        listbox.classList.toggle('hidden', !open);
        input.setAttribute('aria-expanded', open ? 'true' : 'false');
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        var icon = toggle.querySelector('.material-symbols-outlined');
        if (icon) icon.textContent = open ? 'expand_less' : 'expand_more';
      }

      function renderOptions(filterText) {
        var query = (filterText || '').trim().toUpperCase();
        var matches = savedBuses.filter(function (bus) {
          return !query || bus.toUpperCase().indexOf(query) !== -1;
        });

        listbox.innerHTML = '';

        matches.forEach(function (bus) {
          var li = document.createElement('li');
          li.setAttribute('role', 'option');
          li.setAttribute('aria-selected', bus.toUpperCase() === input.value.trim().toUpperCase() ? 'true' : 'false');
          li.className = 'px-3.5 py-2.5 min-h-11 flex items-center justify-between gap-2 cursor-pointer hover:bg-[#FFCA7A] nb-mono text-sm font-bold text-[#18181B] border-b border-[#18181B] last:border-b-0';

          var label = document.createElement('span');
          label.textContent = bus;

          var badge = document.createElement('span');
          badge.className = 'text-xs font-bold uppercase px-2 py-0.5 bg-[#C8EC74] border border-[#18181B] rounded-full';
          badge.textContent = 'SAVED';

          li.appendChild(label);
          li.appendChild(badge);
          li.addEventListener('mousedown', function (e) {
            e.preventDefault();
            input.value = bus;
            setOpen(false);
          });
          listbox.appendChild(li);
        });

        if (query && savedBuses.every(function (b) { return b.toUpperCase() !== query; })) {
          var addLi = document.createElement('li');
          addLi.setAttribute('role', 'option');
          addLi.className = 'px-3.5 py-2.5 min-h-11 flex items-center gap-2 cursor-pointer bg-[#C8EC74] hover:bg-[#FFCA7A] text-[#18181B] text-sm font-bold border-t-2 border-[#18181B]';
          addLi.innerHTML = '<span class="material-symbols-outlined text-[18px]" aria-hidden="true">add_circle_outline</span><span>Save &ldquo;' + query + '&rdquo;</span>';
          addLi.addEventListener('mousedown', function (e) {
            e.preventDefault();
            savedBuses.unshift(query);
            persistBuses();
            input.value = query;
            setOpen(false);
          });
          listbox.appendChild(addLi);
        }
      }

      input.addEventListener('focus', function () { renderOptions(''); setOpen(true); });
      input.addEventListener('input', function () { renderOptions(input.value); setOpen(true); });
      toggle.addEventListener('click', function () {
        var isOpen = !listbox.classList.contains('hidden');
        if (isOpen) setOpen(false);
        else { renderOptions(''); setOpen(true); input.focus(); }
      });
      document.addEventListener('click', function (e) {
        if (!wrapper.contains(e.target)) setOpen(false);
      });
    })();

    (function () {
      var KEY = 'joymaa_waybill_v1';
      var dateEl = document.getElementById('waybill-date-input');
      var dateDisplayEl = document.getElementById('waybill-date-display');
      var busEl = document.getElementById('bus-number-input');
      var driverEl = document.getElementById('driver-name-input');
      var licenseEl = document.getElementById('driver-license-input');
      var conductorEl = document.getElementById('conductor-name-input');
      var bagEl = document.getElementById('bag-money-input');

      function formatWaybillDate(iso) {
        if (!iso) return 'Tue, 24 Nov 2026';
        var parts = iso.split('-');
        if (parts.length !== 3) return 'Tue, 24 Nov 2026';
        var d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
        if (isNaN(d.getTime())) return 'Tue, 24 Nov 2026';
        var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        return days[d.getDay()] + ', ' + d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
      }
      function updateDateDisplay() {
        if (!dateEl || !dateDisplayEl) return;
        dateDisplayEl.textContent = formatWaybillDate(dateEl.value || '2026-11-24');
      }
      function loadState() {
        try { return JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { return {}; }
      }
      function saveStep1() {
        var st = loadState();
        var iso = (dateEl && dateEl.value) || '2026-11-24';
        st.trip = {
          dateISO: iso,
          date: formatWaybillDate(iso),
          busNo: (busEl && busEl.value.trim().toUpperCase()) || 'WB 07 J 4625',
          driverName: (driverEl && driverEl.value.trim()) || 'Ramesh Mondal',
          driverLicense: (licenseEl && licenseEl.value.trim().toUpperCase()) || 'WB07 20180045192',
          conductorName: (conductorEl && conductorEl.value.trim()) || 'Suman Das',
          bagMoney: (bagEl && bagEl.value.replace(/[^\d.]/g, '')) || '500'
        };
        try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {}
      }

      var existing = loadState();
      if (existing.trip) {
        if (dateEl && existing.trip.dateISO) dateEl.value = existing.trip.dateISO;
        if (busEl && existing.trip.busNo) busEl.value = existing.trip.busNo;
        if (driverEl && existing.trip.driverName) driverEl.value = existing.trip.driverName;
        if (licenseEl && existing.trip.driverLicense) licenseEl.value = existing.trip.driverLicense;
        if (conductorEl && existing.trip.conductorName) conductorEl.value = existing.trip.conductorName;
        if (bagEl && existing.trip.bagMoney) bagEl.value = existing.trip.bagMoney;
        updateDateDisplay();
      } else {
        updateDateDisplay();
        saveStep1();
      }

      if (dateEl) {
        dateEl.addEventListener('click', function () {
          try { if (dateEl.showPicker) dateEl.showPicker(); } catch (e) {}
        });
        dateEl.addEventListener('change', function () {
          updateDateDisplay();
          saveStep1();
        });
        dateEl.addEventListener('input', function () {
          updateDateDisplay();
          saveStep1();
        });
      }
      [busEl, driverEl, licenseEl, conductorEl, bagEl].forEach(function (el) {
        if (el) el.addEventListener('input', saveStep1);
      });
      var nextLink = document.querySelector('footer a');
      if (nextLink) nextLink.addEventListener('click', saveStep1);
      var listbox = document.getElementById('bus-number-listbox');
      if (listbox) listbox.addEventListener('mousedown', function () { setTimeout(saveStep1, 0); });
    })();
  </script>
